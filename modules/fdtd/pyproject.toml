[project]
name = "polaris-fdtd"
version = "5.0.0"
description = "PoLaRIS 时域有限差分（FDTD）仿真子模块（Yee 1966 + Gedney PML + JAX 可微）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "jax>=0.4",
    "jaxlib>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
