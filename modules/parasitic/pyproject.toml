[project]
name = "polaris-parasitic"
version = "5.0.0"
description = "PoLaRIS 寄生提取与 Verilog-A 紧凑模型生成子模块（R/L/C/S/SPICE + 5 器件 Verilog-A）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
