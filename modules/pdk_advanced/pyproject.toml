[project]
name = "polaris-pdk-advanced"
version = "5.1.0"
description = "PoLaRIS 高级 PDK（gdsfactory 桥接/OptoDesigner/PCell/YAML 配置/多 PDK 管理/多 foundry）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
