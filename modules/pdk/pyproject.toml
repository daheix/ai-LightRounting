[project]
name = "polaris-pdk"
version = "5.0.0"
description = "PoLaRIS PDK 器件库管理 + GDSII 导入导出（SOI/SiN/InP/LNOI 四平台）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "klayout>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
