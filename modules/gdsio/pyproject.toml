[project]
name = "polaris-gdsio"
version = "5.1.0"
description = "PoLaRIS GDSII 导入导出子模块（klayout.db 后端，单一职责：I/O）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "klayout>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
