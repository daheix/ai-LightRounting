[project]
name = "polaris-klm"
version = "5.1.0"
description = "PoLaRIS KLM 线性光学量子计算子模块（KLM CNOT Ralph 2002，成功率 1/9）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
