[project]
name = "polaris-router-advanced"
version = "5.0.0"
description = "PoLaRIS 高级布线子模块（JPS/Bundle/AllAngle/Euler/Global/多层/混合布线 + 高级连接器）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
