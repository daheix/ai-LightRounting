[project]
name = "polaris-eme"
version = "5.0.0"
description = "PoLaRIS 本征模展开（EME）仿真子模块（切片 + 模式匹配 + S 矩阵级联）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
