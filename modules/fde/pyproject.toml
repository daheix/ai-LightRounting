[project]
name = "polaris-fde"
version = "5.0.0"
description = "PoLaRIS 频域本征模（FDE）仿真子模块（2D 有限差分 + scipy.sparse.linalg.eigsh）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
