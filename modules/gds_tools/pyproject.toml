[project]
name = "polaris-gds-tools"
version = "5.1.0"
description = "PoLaRIS GDSII 工程化工具与多格式 IO 子模块（klayout 后端，纯 NumPy）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "klayout>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
