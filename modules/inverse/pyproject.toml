[project]
name = "polaris-inverse"
version = "5.1.0"
description = "PoLaRIS 逆向设计子模块（adjoint + topology + level-set + 3D，6 器件统一优化框架）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "jax>=0.4",
    "jaxlib>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
