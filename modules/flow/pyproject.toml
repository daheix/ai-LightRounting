[project]
name = "polaris-flow"
version = "5.0.0"
description = "PoLaRIS 通用流程编排（Job/Stage/Recipe 调度 + IPKISS 兼容 + Design Intent + 分布式调度 + AI 逆向设计 + 训练流水线）"
requires-python = ">=3.10"
dependencies = [
    "polaris-core",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
