[project]
name = "polaris-sparam"
version = "5.0.0"
description = "PoLaRIS 频域 S 参数子模块（波导/MMI/GC S 参数 + MZI 扫描 + Clements 酉矩阵）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
