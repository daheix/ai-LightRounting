[project]
name = "polaris-pam4"
version = "5.0.0"
description = "PoLaRIS PAM4 信号仿真子模块（4 电平调制 + BER/SNR/眼图）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
