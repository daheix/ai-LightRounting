[project]
name = "polaris-drc"
version = "5.0.0"
description = "PoLaRIS DRC 设计规则检查子模块（25 条 SiEPIC EBeam PDK + P0 波导级 + P1 跨层 DRC 规则，AABB 几何算法）"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
