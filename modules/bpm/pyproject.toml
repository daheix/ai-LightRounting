[project]
name = "polaris-bpm"
version = "5.0.0"
description = "PoLaRIS 光束传播法（BPM）仿真子模块（Crank-Nicolson 隐式时间步进）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
