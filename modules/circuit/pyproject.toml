[project]
name = "polaris-circuit"
version = "5.0.0"
description = "PoLaRIS 电路级仿真子模块（频域/时域/SPICE MNA/系统级/电路互联）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
