[project]
name = "polaris-lumerical"
version = "5.0.0"
description = "PoLaRIS 商业软件集成子模块（Lumerical FDTD/MODE/CHARGE/INTERCONNECT + Tidy3D + MEEP + 光电协同 + CML Compiler）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
