[project]
name = "polaris-nn"
version = "5.0.0"
description = "PoLaRIS 神经网络与数据 benchmark 子模块（Linear/Conv2d/Attention/TransformerBlock/Adam + BenchmarkEvaluator/DatasetGenerator/DataLoader）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
