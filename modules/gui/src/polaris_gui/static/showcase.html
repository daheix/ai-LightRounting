<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoLaRIS 端到端 Demo Showcase</title>
<link rel="stylesheet" href="showcase.css">
</head>
<body>
<header class="hero">
  <div class="container">
    <h1>PoLaRIS 端到端 Demo Showcase</h1>
    <p class="subtitle">36 路标能力端到端集成演示 · 9 阶段全流程</p>
    <div class="badges">
      <span class="badge">4 平台 PDK</span>
      <span class="badge">AI 布局布线</span>
      <span class="badge">仿真验证</span>
      <span class="badge">GDS 导出</span>
      <span class="badge">量子光子</span>
    </div>
  </div>
</header>

<section class="controls">
  <div class="container controls-row">
    <button id="run-btn" class="btn-primary">启动 Showcase</button>
    <span id="run-status" class="run-status">就绪</span>
    <a href="/" class="back-link">返回主页</a>
  </div>
</section>

<main class="container">
  <section class="panel">
    <h2>9 阶段执行进度</h2>
    <div id="stages-grid" class="stages-grid">
      <!-- 9 个阶段卡片由 showcase.js 动态渲染 -->
    </div>
  </section>

  <section class="panel">
    <h2>汇总统计</h2>
    <div id="summary-grid" class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="stat-done">0</span>
        <div class="stat-label">已完成</div>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-failed">0</span>
        <div class="stat-label">失败</div>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <div class="stat-label">总数</div>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-duration">—</span>
        <div class="stat-label">总耗时 (s)</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>实时日志</h2>
    <pre id="log-output" class="log-output">等待启动...</pre>
  </section>

  <section class="panel" id="error-panel" style="display:none;">
    <h2>错误信息</h2>
    <pre id="error-content" class="error-box"></pre>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>PoLaRIS 光弈 © 2026 · 端到端 Demo Showcase · 来源: SiEPIC/Ligentec/HyperLight/Pattern Project PDK</p>
  </div>
</footer>

<script src="showcase.js"></script>
</body>
</html>
