<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoLaRIS 光弈 — 光电子AI智能布局布线引擎</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="container">
    <h1>PoLaRIS 光弈</h1>
    <p class="subtitle">光电子AI智能布局布线引擎 · 商业化前端</p>
    <div class="badges">
      <span class="badge">DRV-free</span>
      <span class="badge">4 平台</span>
      <span class="badge">RL + GNN</span>
      <span class="badge">开源 AGPL</span>
    </div>
  </div>
</header>

<main class="container">
  <section class="panel">
    <h2>电路选择</h2>
    <div id="presets" class="presets-grid">
      <div class="loading">加载预设电路...</div>
    </div>
  </section>

  <section class="panel">
    <h2>运行配置</h2>
    <div class="config-row">
      <label for="routerType">布线器类型</label>
      <select id="routerType">
        <option value="default">默认（A* 折线）</option>
        <option value="curvy">弯曲感知（LiDAR 欧拉弯曲）</option>
      </select>
      <button id="runBtn" class="btn-primary" disabled>一键布局布线</button>
    </div>
  </section>

  <section class="panel" id="resultPanel" style="display:none;">
    <h2>运行结果</h2>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="canvas-wrapper">
      <h3>版图可视化</h3>
      <canvas id="layoutCanvas" width="800" height="500"></canvas>
    </div>
    <div class="paths-section">
      <h3>布线路径详情</h3>
      <table class="paths-table">
        <thead>
          <tr><th>连接</th><th>长度 (μm)</th><th>损耗 (dB)</th><th>点数</th></tr>
        </thead>
        <tbody id="pathsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="errorPanel" style="display:none;">
    <h2>错误信息</h2>
    <pre id="errorContent" class="error-box"></pre>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>PoLaRIS 光弈 © 2026 · 开源 AGPL · 来源: LiDAR ISPD'25 + AlphaChip Nature 2021</p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
