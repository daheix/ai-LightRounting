[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-pnr"
version = "5.0.0"
description = "PoLaRIS 光弈：光电子AI自动布局布线引擎（千轮迭代收官版 v5.0）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "PoLaRIS Team" },
]
keywords = ["photonics", "place-and-route", "layout", "routing", "AI", "EDA"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "torch",
    "gymnasium",
    "matplotlib",
    "pyyaml",
    "klayout",
    "simphony",
    "sax",
    "gdstk",
    "shapely",
]

[project.optional-dependencies]
# gdsfactory 因上游 pydantic 版本锁定，在 Python 3.14 下不可用（规则 5.3 例外）
# 在 Python 3.10-3.13 环境下安装: pip install polaris-pnr[gdsfactory]
gdsfactory = [
    "gdsfactory>=8.0",
]
# SiPANN 因依赖 tensorflow 无 Python 3.14 支持，仅在 Python 3.10-3.13 环境下安装
sipann = [
    "SiPANN",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
polaris = "polaris.pipeline:main"

[project.urls]
Repository = "https://github.com/daheix/ai-LightRounting"

[tool.setuptools.packages.find]
where = ["src", "3dtool"]
include = ["polaris*", "pycopy*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # 行宽由 formatter 控制（P01 规则）

[tool.ruff.lint.per-file-ignores]
# __init__.py 使用 re-export 模式对外暴露 API，F401 为 ruff 误报
"__init__.py" = ["F401"]
"__init__.pyi" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

# pytest 9 自身源码使用 3.10+ match 语法，与 python_version=3.9 冲突；
# 跳过对其源码体的解析（仅用于开发工具链兼容，不影响 polaris 自身类型检查）
[[tool.mypy.overrides]]
module = "pytest.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "3dtool"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
